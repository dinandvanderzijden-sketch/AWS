name: "AWS Infrastructure & App CI/CD"

on:
  push:
    branches:
      - main
  pull_request:

# Least privilege: de workflow heeft geen federatieve token nodig om in te
# loggen, dus die permissie ontbreekt bewust. 'contents: read' volstaat om de
# code uit te checken.
permissions:
  contents: read

jobs:
  # ==============================================================
  # 0. Snelle kwaliteitschecks - draait zonder AWS-credentials.
  #
  #    REQ-NCA-P1-07 eist dat een push "automatisch tests" triggert. In de
  #    eerdere versie gebeurde er na 'terraform validate' niets meer: een
  #    syntactisch geldige maar kapotte configuratie (verkeerde verwijzing,
  #    onbekende variabele, onveilige security group) rolde gewoon uit.
  #    Deze job vangt dat op vóórdat er iets naar AWS gaat.
  # ==============================================================
  lint:
    name: "Lint & Format"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2

      # Bewust GEEN 'terraform init': voor fmt en validate is geen provider
      # nodig. Zo blijft deze job ook werken als de S3-backend of de
      # AWS-credentials niet bereikbaar zijn - ook bij een PR uit een fork,
      # waar GitHub geen secrets meestuurt.
      - name: Terraform Format Check
        run: terraform fmt -check -recursive -diff

      - name: Terraform Validate (zonder backend)
        run: terraform init -backend=false -input=false && terraform validate -no-color

      # De README en de documentatie verwijzen naar REQ-ID's en bestanden.
      # Een test die faalt als een REQ-ID uit de requirementslijst verdwijnt,
      # is een bewakersrol voor het onderzoeksdocument.
      - name: Controleer dat de REQ-ID's nog in de README staan
        run: |
          set -euo pipefail
          for req in REQ-NCA-P1-01 REQ-NCA-P1-02 REQ-NCA-P1-03 REQ-NCA-P1-04 \
                     REQ-NCA-P1-05 REQ-NCA-P1-06 REQ-NCA-P1-07 REQ-NCA-P1-08; do
            grep -q "$req" README.md || { echo "FOUT: $req ontbreekt in README.md"; exit 1; }
            echo "OK  $req"
          done

  # ==============================================================
  # 1. Plan/preview vóór uitrol (REQ-NCA-P1-07)
  #
  #    LET OP - deze job is NIET meer read-only. Zonder OIDC is er één
  #    sleutelset, en die heeft dezelfde rechten als de deploy-job. De
  #    scheiding plan/deploy zat in de trust policy van de OIDC-rollen en is
  #    met het verwijderen van OIDC verdwenen.
  #
  #    Wat dit openlaat: een pull request binnen deze repo draait dus met
  #    schrijfrechten. Een PR uit een FORK krijgt daarom geen secrets van
  #    GitHub en zou hier falen - daarom staat de `if`-guard hieronder, zodat
  #    zo'n PR netjes wordt overgeslagen in plaats van te breken. De
  #    lint-job draait wél voor iedereen.
  #
  #    Zie README.md voor de aanbevolen extra horde: zet de secrets op een
  #    GitHub Environment, dan zijn ze alleen beschikbaar na een handmatige
  #    goedkeuring.
  # ==============================================================
  plan:
    name: "Validate & Plan"
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # De AWS-sleutels komen uit GitHub Secrets. Zie README.md voor de
      # IAM-user die je daarvoor aanmaakt, en voor rotatie.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      # Zelfcontrole. Zou er ooit een access key van een persoon of uit een
      # ander systeem in de secrets belanden, dan faalt deze stap hard in
      # plaats van stilletjes met die sleutel te draaien. GetCallerIdentity
      # hoeft geen enkele IAM-permissie.
      - name: Controleer dat we als de CI-gebruiker binnenkomen
        run: |
          set -euo pipefail
          ARN=$(aws sts get-caller-identity --query Arn --output text)
          echo "Ingelogd als: $ARN"
          case "$ARN" in
            arn:aws:iam::*:user/github-actions-deploy) echo "OK: de CI-gebruiker" ;;
            *) echo "FOUT: dit is niet de IAM-user github-actions-deploy ($ARN)."; exit 1 ;;
          esac

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2

      - name: Terraform Init
        run: terraform init -no-color

      - name: Terraform Validate
        run: terraform validate -no-color

      # 'terraform test' voert de assertions uit in tests/*.tftest.hcl. Met
      # 'command = plan' worden ze gecontroleerd zonder dat er iets in AWS
      # verandert.
      - name: Terraform Tests (plan-based assertions)
        run: terraform test -no-color

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -input=false -out=tfplan
          terraform show -no-color tfplan > plan.txt || true
          {
            echo '### Terraform plan'
            echo '```'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: "Deploy Infrastructure & Application"
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Controleer dat we als de CI-gebruiker binnenkomen
        run: |
          set -euo pipefail
          ARN=$(aws sts get-caller-identity --query Arn --output text)
          echo "Ingelogd als: $ARN"
          case "$ARN" in
            arn:aws:iam::*:user/github-actions-deploy) echo "OK: de CI-gebruiker" ;;
            *) echo "FOUT: dit is niet de IAM-user github-actions-deploy ($ARN)."; exit 1 ;;
          esac

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2

      - name: Terraform Init
        run: terraform init -no-color

      # Let op: we draaien hier nogmaals een plan. De 'plan'-job draait op een
      # andere runner, dus het tfplan-bestand van die job bestaat hier niet.
      # Een opgeslagen plan is bovendien platform-gebonden; opnieuw plannen
      # is hier het betrouwbaardere en scheelt een artifact-upload.
      - name: Terraform Plan (voor de apply)
        run: terraform plan -no-color -input=false -lock-timeout=5m -out=tfplan

      # REQ-NCA-P1-07: "Infrastructuurwijzigingen tonen eerst een plan/preview
      # alvorens automatisch of handmatig worden goedgekeurd en toegepast."
      # De plan staat al in de step summary van de plan-job; deze stap haalt de
      # namen uit de state zodat de onderstaande stappen niet meer naar
      # cluster-, service- of codedeploy-namen hoeven te verwijzen. Die namen
      # stonden hier voorheen hardcoded en konden zo uit sync raken met de
      # werkelijke infrastructuur (REQ-NCA-P1-08).
      - name: Haal de resourcenamen uit de Terraform-output
        id: names
        run: |
          set -euo pipefail
          {
            echo "cluster=$(terraform output -raw ecs_cluster_name)"
            echo "service=$(terraform output -raw ecs_service_name)"
            echo "app=$(terraform output -raw codedeploy_app_name)"
            echo "dg=$(terraform output -raw codedeploy_deployment_group_name)"
            echo "ecr=$(terraform output -raw ecr_repository_url)"
            echo "db=$(terraform output -raw database_endpoint)"
          } >> "$GITHUB_OUTPUT"

      - name: Terraform Apply
        run: terraform apply -no-color -input=false -auto-approve tfplan

      # 1. Docker build & push naar ECR
      - name: Log in op Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ steps.names.outputs.ecr }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # 2. Nieuwe task-definition-revisie met de zojuist gepushte image
      #
      #    Deze stap is NIET weglaten. Zonder render maak je geen nieuwe revisie
      #    aan, en zou CodeDeploy de oude image blijven deployen.
      #
      #    De 'overrides' hieronder zijn de fix voor een echte drift-bug:
      #    task-definition.json bevatte een hardcoded RDS-endpoint. Als de
      #    database ooit werd vervangen of hernoemd, bleef de uitgerolde taak
      #    naar het oude adres wijzen terwijl Terraform al de nieuwe had. Nu komt
      #    DB_HOST uit de Terraform-output en kan dat niet meer gebeuren
      #    (REQ-NCA-P1-03: omgevingsvariabelen via geautomatiseerde variabelen).
      - name: Render new task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: nginx
          image: ${{ steps.build-image.outputs.image }}
          overrides: |
            [
              {
                "name": "nginx",
                "environment": [
                  { "name": "DB_HOST", "value": "${{ steps.names.outputs.db }}" },
                  { "name": "DB_NAME", "value": "appdb" }
                ]
              }
            ]

      # 3. Blue/green deploy via CodeDeploy
      #
      #    De ECS-service draait met deployment_controller = "CODE_DEPLOY"
      #    (compute.tf). Daarom werkt 'aws ecs update-service
      #    --force-new-deployment' hier niet: dat slaat de verkeersshift over.
      - name: Deploy via CodeDeploy (Blue/Green)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ steps.names.outputs.service }}
          cluster: ${{ steps.names.outputs.cluster }}
          codedeploy-appspec: appspec.yaml
          codedeploy-application: ${{ steps.names.outputs.app }}
          codedeploy-deployment-group: ${{ steps.names.outputs.dg }}
          wait-for-service-stability: true

      # 4. Bewijs dat de nieuwe versie echt verkeerskrijgt. Zonder deze stap
      #    is een geslaagde deployment onvindbaar in bewijs.
      - name: Bevestig dat de site de nieuwe versie serveert
        run: |
          set -euo pipefail
          ALB=$(terraform output -raw alb_dns_name)
          for i in $(seq 1 20); do
            if body=$(curl -fsS --max-time 5 "http://$ALB/" 2>/dev/null); then
              echo "HTTP 200 via $ALB (poging $i)"
              echo "$body" | grep -o '<h1>[^<]*</h1>' || true
              exit 0
            fi
            sleep 5
          done
          echo "FOUT: de ALB gaf na 100 seconden geen 200 terug."
          exit 1
